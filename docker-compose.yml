services:
  db:
    image: postgres:16-alpine
    container_name: school_store_db
    restart: always
    environment:
      POSTGRES_DB: school_store
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: supersecure_db_password
    command: >
      postgres
      -c max_connections=100
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=100
      -c logging_collector=on
      -c log_destination=stderr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user -d school_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.22.0
    container_name: school_store_pgbouncer
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: school_user
      DB_PASSWORD: supersecure_db_password
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: school_store
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 120
      AUTH_TYPE: plain
    ports:
      - "6432:6432"

  redis:
    image: redis:7-alpine
    container_name: school_store_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_store_api
    restart: always
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "prod-secret-key-must-be-provided-in-env-file"
      DATABASE_URL: "postgresql://school_user:supersecure_db_password@pgbouncer:6432/school_store"
      REDIS_URL: "redis://redis:6379"
      ALLOWED_HOSTS: "store.school.internal,localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "https://store.school.internal"
      SECURE_SSL_REDIRECT: "0"
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "10"
      USE_DB_POOL: "0"
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_store_worker
    restart: always
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "prod-secret-key-must-be-provided-in-env-file"
      DATABASE_URL: "postgresql://school_user:supersecure_db_password@pgbouncer:6432/school_store"
      REDIS_URL: "redis://redis:6379"
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "2"
      USE_DB_POOL: "0"
    command: celery -A config worker -l info --concurrency=4 -Q celery

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_store_beat
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "prod-secret-key-must-be-provided-in-env-file"
      DATABASE_URL: "postgresql://school_user:supersecure_db_password@pgbouncer:6432/school_store"
      REDIS_URL: "redis://redis:6379"
    command: celery -A config beat -l info

volumes:
  postgres_data:
  redis_data:
