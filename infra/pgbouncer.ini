[databases]
school_store = host=127.0.0.1 port=5432 dbname=school_store user=postgres

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = trust
auth_file = /home/user/School_Store/infra/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600
log_connections = 0
log_disconnections = 0

; Connection Budget Math (Rule P7):
; PostgreSQL max_connections = 100
; Option A (Django psycopg3 native pool):
;   Web workers (4) x DB_POOL_MAX_SIZE (10) = 40
;   Celery job workers (4) x DB_POOL_MAX_SIZE (2) = 8
;   Total = 48 connections (< 100 max_connections)
; Option B (PgBouncer transaction pooling in front of PostgreSQL):
;   max_client_conn = 500 concurrent app connections multiplexed onto
;   default_pool_size (20) + reserve_pool_size (5) = 25 backend PostgreSQL connections (< 100 max_connections)
